<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Source Han Sans SC, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="390" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">中国钢琴产量（协会口径）</text>
  <text x="390" y="58" text-anchor="middle" font-size="14.5" fill="#555">2003–2023 · 单位：万架 · 仅三个锚点年份</text>

  <!-- 网格线 -->
  <line x1="80" y1="305" x2="700" y2="305" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="80" y1="230" x2="700" y2="230" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="80" y1="155" x2="700" y2="155" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="80" y1="80" x2="700" y2="80" stroke="#eaeaea" stroke-width="1"/>

  <!-- 坐标轴 -->
  <line x1="80" y1="80" x2="80" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="700" y2="380" stroke="#333" stroke-width="1.5"/>

  <!-- y 刻度 -->
  <g font-size="14" fill="#333" text-anchor="end">
    <text x="72" y="385">0</text>
    <text x="72" y="310">10</text>
    <text x="72" y="235">20</text>
    <text x="72" y="160">30</text>
    <text x="72" y="85">40</text>
  </g>
  <g stroke="#333" stroke-width="1">
    <line x1="76" y1="380" x2="80" y2="380"/>
    <line x1="76" y1="305" x2="80" y2="305"/>
    <line x1="76" y1="230" x2="80" y2="230"/>
    <line x1="76" y1="155" x2="80" y2="155"/>
    <line x1="76" y1="80" x2="80" y2="80"/>
  </g>
  <text x="26" y="230" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 26 230)">产量（万架）</text>

  <!-- x 刻度 -->
  <g stroke="#333" stroke-width="1">
    <line x1="80" y1="380" x2="80" y2="386"/>
    <line x1="235" y1="380" x2="235" y2="386"/>
    <line x1="390" y1="380" x2="390" y2="386"/>
    <line x1="545" y1="380" x2="545" y2="386"/>
    <line x1="700" y1="380" x2="700" y2="386"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="80" y="404">2003</text>
    <text x="235" y="404">2008</text>
    <text x="390" y="404">2013</text>
    <text x="545" y="404">2018</text>
    <text x="700" y="404">2023</text>
  </g>

  <!-- 趋势虚线（非逐年数据，不构成插值） -->
  <polyline points="80,155 576,87.5 700,237.5" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- 断点记号：无锚点年区间 -->
  <g stroke="#555" stroke-width="1.8">
    <line x1="323" y1="127" x2="329" y2="115"/>
    <line x1="329" y1="127" x2="335" y2="115"/>
    <line x1="633" y1="168" x2="639" y2="156"/>
    <line x1="639" y1="168" x2="645" y2="156"/>
  </g>

  <!-- 锚点 -->
  <circle cx="80" cy="155" r="6" fill="#111"/>
  <circle cx="576" cy="87.5" r="6" fill="#111"/>
  <circle cx="700" cy="237.5" r="6" fill="#111"/>

  <!-- 关键点数值标注（右缘一律 end 锚点，置于点左侧/上方） -->
  <text x="90" y="122" font-size="15" font-weight="bold" fill="#111">2003 首破 30 万架</text>
  <text x="566" y="78" text-anchor="end" font-size="15"><tspan font-weight="bold" fill="#111">2019 峰值 39 万架</tspan><tspan font-size="12" fill="#555">（占全球约 75%）</tspan></text>
  <text x="694" y="262" text-anchor="end" font-size="15" font-weight="bold" fill="#111">2023 约 19 万架</text>

  <!-- 脚注分隔线 -->
  <line x1="50" y1="416" x2="710" y2="416" stroke="#ccc" stroke-width="1"/>

  <!-- 口径脚注（tspan 分行，行宽控制在安全区内） -->
  <g font-size="12.5" fill="#444">
    <text x="50" y="432"><tspan x="50" y="432">口径：中国乐器协会「产量」——统计企业自报＋调研，非普查；产量≠销量</tspan><tspan x="50" y="450">（协会自认无准确年销量数据）。〔数据锚点 §1〕</tspan><tspan x="50" y="468">2023 年另有协会「预计销量 16 万架」（预计值口径），与产量口径不可混用、不入本图。</tspan><tspan x="50" y="486">限制：仅 2003 / 2019 / 2023 三个锚点年，其余年份无锚点数值；虚线只示意趋势方向，不构成逐年数据。</tspan></text>
  </g>
</svg>
